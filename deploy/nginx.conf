server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/auma/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50m;

    # Документы AUMA качаются с их сайта — даём запас по времени
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;

    access_log /var/log/nginx/auma.access.log;
    error_log  /var/log/nginx/auma.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~* /uploads/ {
        # Файлы отдаются только через PHP (проверка входа), напрямую не раздаём
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
